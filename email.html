<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        table {
            border-spacing: 0;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007BFF;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .footer a {
            margin: 0 5px;
            text-decoration: none;
            color: #555;
        }
        .footer img {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
    <table>
        <!-- Header con logo -->
        <tr>
            <td style="text-align: center; padding: 20px;">
                <img src="https://via.placeholder.com/150" alt="Logo de la marca" style="width: 150px;">
            </td>
        </tr>

        <!-- Contenido principal -->
        <tr>
            <td style="padding: 20px; text-align: left;">
                <h1 style="font-size: 24px; color: #333;">¡Hola!</h1>
                <p style="font-size: 16px; color: #555;">Estamos emocionados de compartir contigo nuestra última oferta y noticias importantes. Descubre lo que tenemos preparado especialmente para ti.</p>
                <p style="font-size: 16px; color: #555;">Explora nuestros productos y encuentra todo lo que necesitas con increíbles descuentos.</p>
            </td>
        </tr>

        <!-- Imagen centrada -->
        <tr>
            <td style="text-align: center; padding: 20px;">
                <img src="https://via.placeholder.com/600x300" alt="Imagen destacada">
            </td>
        </tr>

        <!-- Botón -->
        <tr>
            <td style="text-align: center; padding: 20px;">
                <a href="https://example.com" class="button">Haz clic aquí</a>
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td style="padding: 20px; text-align: center; background-color: #f4f4f4;">
                <p style="font-size: 14px; color: #777;">Síguenos en nuestras redes sociales:</p>
                <div class="footer">
                    <a href="#">
                        <img src="https://via.placeholder.com/24?text=F" alt="Facebook">
                    </a>
                    <a href="#">
                        <img src="https://via.placeholder.com/24?text=T" alt="Twitter">
                    </a>
                    <a href="#">
                        <img src="https://via.placeholder.com/24?text=I" alt="Instagram">
                    </a>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
