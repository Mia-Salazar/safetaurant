    <main class="main add-restaurant">
      <h2>Añadir restaurante</h2>
      <p id="subtitle">Registra un restaurante para poder puntuarlo en <span class="logo-text">SafeTaurant</span>. Los campos con un asterisco (*) son obligatorios.</p>
      <div class="add-restaurant-wrapper">
        <form class="add-restaurant-form" id="add">
          <div class="input-group">
            <label class="input-label" for="Name">Nombre del restaurante*: </label>
            <input class="input" id="Name" name="Name" type="text" required />
          </div>
          <div class="input-group">
            <label class="input-label" for="CCAA">Comunidad Autónoma*: </label>
            <select name="CCAA" id="CCAA" class="select" required>
              <option selected disabled value="">Escoje CCAA</option>
            </select>
          </div>
          <div class="input-group">
            <label class="input-label" for="Province">Provincia*: </label>
            <select name="Province" id="Province" class="select" required>
              <option selected disabled value="">Escoje Provincia</option>
            </select>
          </div>
          <div class="input-group">
            <label class="input-label" for="Address">Dirección*: </label>
            <input class="input" id="Address" name="Address" type="text" required />
          </div>
          <div class="input-group">
            <label class="input-label" for="ZIP">Código Postal*: </label>
            <input class="input" id="ZIP" name="ZIP" type="number" required />
          </div>
          <div class="input-group">
            <label class="input-label" for="Phone">Teléfono: </label>
            <input class="input" id="Phone" name="Phone" type="number" />
          </div>
          <div class="input-group">
            <label class="input-label" for="FoodType">Tipo de comida: </label>
            <select name="FoodType" id="FoodType" class="select">
              <option selected disabled value="">Escoje el tipo</option>
            </select>
          </div>
          <small id="feedback" class=""></small>
          <button type="submit" class="primary-button" id="buttonSubmit">Crear restaurante</button>
        </form>
        <div class="decoration-wrapper">
          <figure class="img-container">
            <img class="img" alt="" src="../assets/img/food.jpg" />
          </figure>
        </div>
      </div>
    </main>
    <footer class="footer">
      <p><span class="logo-text">SafeTaurant</span>, restaurantes sin alergias</p>
      <p>Proyecto realizado por <a href="miasalazar.com" target="_blank">María Salazar</a></p>
    </footer>
  </body>
  <script type="text/javascript" src="./shared.js"></script>
  <script>
    const provinces = ["Alava", "Albacete", "Alicante", "Almería", "Asturias", "Avila", "Badajoz", "Barcelona", "Burgos", "Cáceres",
            "Cádiz", "Cantabria", "Castellón", "Ciudad Real", "Córdoba", "La Coruña", "Cuenca", "Gerona", "Granada", "Guadalajara",
            "Guipúzcoa", "Huelva", "Huesca", "Islas Baleares", "Jaén", "León", "Lérida", "Lugo", "Madrid", "Málaga", "Murcia", "Navarra",
            "Orense", "Palencia", "Las Palmas", "Pontevedra", "La Rioja", "Salamanca", "Segovia", "Sevilla", "Soria", "Tarragona",
            "Santa Cruz de Tenerife", "Teruel", "Toledo", "Valencia", "Valladolid", "Vizcaya", "Zamora", "Zaragoza"];
    const CCAA = ["Andalucía", "Aragón", "Canarias", "Cantabria", "Castilla y León", "Castilla-La Mancha", "Cataluña", "Ceuta", "Comunidad Valenciana", "Comunidad de Madrid", "Extremadura", "Galicia", "Islas Baleares", "La Rioja", "Melilla", "Navarra", "País Vasco", "Principado de Asturias", "Región de Murcia"];
    const foodType = ["Italiana", "Fast Food", "Mexicana", "Japonesa", "Coreana", "Pastelería", "Cafetería", "Tapas", "China", "Pizza", "Hamburguesa",
    "Vegana", "Vegetariana", "Vietnamita", "Peruana", "India", "Tailandesa", "Alta cocina", "Fusión", "Catering", "Otro"];

    const provinceSelect = document.getElementById("Province");
    const communitySelect = document.getElementById("CCAA");
    const foodSelect = document.getElementById("FoodType");
    const feedback = document.getElementById("feedback");
    document.getElementById("add").addEventListener("submit", registerRestaurant, false);

    function addCities() {
      provinces.forEach((province) => {
        let option = document.createElement("option");
        option.value = province;
        option.innerHTML = province;
        provinceSelect.appendChild(option);
      });
      CCAA.forEach((community) => {
        let option = document.createElement("option");
        option.value = community;
        option.innerHTML = community;
        communitySelect.appendChild(option);
      });
      const foodTypeOrderes = foodType.sort();
      foodTypeOrderes.forEach((food) => {
        let option = document.createElement("option");
        option.value = food;
        option.innerHTML = food;
        foodSelect.appendChild(option);
      });
    }

    function registerRestaurant(event){
      event.preventDefault();
      const buttonSubmit = document.getElementById("buttonSubmit");
      const error = document.getElementById("error");
      buttonSubmit.innerHTML = "Cargando...";
      feedback.innerHTML = "";
      const data = {
        Name: document.getElementById("Name").value,
        Province: document.getElementById("Province").value,
        Address: document.getElementById("Address").value,
        ZIP: Number(document.getElementById("ZIP").value),
        Phone: Number(document.getElementById("Phone").value),
        FoodType: document.getElementById("FoodType").value,
        CCAA: document.getElementById("CCAA").value
      };
      console.log(data)
      var xmlhttp = new XMLHttpRequest();
      xmlhttp.open("POST", "http://localhost/TFG/controller/add-restaurant.php", true);
      xmlhttp.setRequestHeader("Content-Type", "application/json");
      xmlhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
          if (this.responseText === "OK") {
            feedback.innerHTML = "Creado correctamente";
            feedback.classList.add("success");
            feedback.classList.remove("error");
          } else {
            feedback.innerHTML = this.responseText;
            feedback.classList.add("error");
            feedback.classList.remove("success");
          }
        }  else if (this.status == 401) {
          window.location.href = "http://localhost/TFG/view/login.html";
        }
        buttonSubmit.innerHTML = "Crear restaurante";
      };
      xmlhttp.send(JSON.stringify(data));
    }

    addCities();

  </script>
</html>
