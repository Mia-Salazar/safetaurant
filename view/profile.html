<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#319DA0" />
    <meta name="description" content="Una aplicación web donde puedes ver y puntuar restaurante según los alérgenos">
    <meta name="keywords" content="alergenos, carta alérgenos, restaurantes, puntuación"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../assets/stylesheets/index.css">
    <link rel="stylesheet" type="text/css" href="../assets/stylesheets/profile.css">
    <link rel="icon" href="../assets/img/favicon.ico" />
    <link rel="apple-touch-icon" href="../assets/img/logo.png" />
    <title>Foodiesaurus, restaurantes sin alergias</title>
  </head>
  <body>
    <header class="header">
      <div class="title-container">
        <a href="https://foodiesaurus.miasalazar.com/index.html" class="home-link" aria-label="Ir a la home">
          <h1 class="title">
            <span>Foodie</span>
            <figure class="logo-container">
              <img class="logo" src="../assets/img/foodiesaurus.png" alt="" />
            </figure>
            <span>saurus</span>
          </h1>
        </a>
      </div>
      <nav class="nav">
        <button id="toggle" class="toggle" aria-label="Alternar menú">
          <i class="toggle-item" aria-hidden="true"></i>
          <i class="toggle-item" aria-hidden="true"></i>
          <i class="toggle-item" aria-hidden="true"></i>
        </button>
        <ul class="nav-list" id="nav">
          <li>
            <a class="nav-link" href="https://foodiesaurus.miasalazar.com/index.html">Buscar</a>
          </li>
          <li>
            <a class="nav-link" href="https://foodiesaurus.miasalazar.com/view/add-restaurant.html">Crear restaurante</a>
          </li>
          <li class="nav-link">
            <button id="account-dropdown-button" class="account-dropdown-button nav-link"
              data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Mi cuenta <i class="arrow down" aria-hidden="true"></i></button>
            <ul id="account-dropdown-list" aria-labelledby="account-dropdown-button" class="dropdown" aria-label="Alternar menú de cuenta">
              <li>
                <a class="nav-link" href="https://foodiesaurus.miasalazar.com/view/profile.html">Perfil</a>
              </li>
              <li>
                <a class="nav-link" href="https://foodiesaurus.miasalazar.com/view/profile-restaurants.html">Mis restaurantes</a>
              </li>
              <li>
                <a class="nav-link" href="">Mis opiniones</a>
              </li>
            </ul>
          </li>
        </ul>
      </nav>
    </header>
    <main class="main profile container">
      <h2>Perfil</h2>
      <p class="subtitle">En esta pagina podrás ver los datos de tu perfil y podrás editarlos.</p>
      <div class="profile-wrapper">
        <div>
          <div class="input-group">
            <p class="input-label">Nombre: </p>
            <p class="input" id="name"></p>
          </div>
          <div class="input-group">
            <p class="input-label">Correo electrónico: </p>
            <p class="input" id="email"></p>
          </div>
          <button class="primary-button logout" type="button" id="logout">Salir</button>
        </div>
        <div class="decoration-wrapper">
          <figure class="img-container">
            <img class="img" alt="" id="img" src="../assets/img/foodiesaurus-v2.png" />
          </figure>
        </div>
      </div>
    </main>
    <footer class="footer">
      <p><span class="logo-text">Foodiesaurus</span>, restaurantes sin alergias</p>
      <p>Proyecto realizado por <a href="https://miasalazar.netlify.app/" target="_blank">Mia Salazar</a></p>
    </footer>
  </body>
  <script type="text/javascript" src="./shared.js"></script>
  <script>
    const subtitle = document.getElementById("subtitle");
    const name = document.getElementById("name")
    const email = document.getElementById("email")
    const img = document.getElementById("img")
    const logout = document.getElementById("logout");
    let user;

    logout.addEventListener("click", logoutFunction, false);

    //Función para salir
    function logoutFunction() {
      var xmlhttp = new XMLHttpRequest();
      xmlhttp.open("GET", "https://foodiesaurus.miasalazar.com/controller/logout.php", true);
      xmlhttp.setRequestHeader("Content-Type", "application/json");
      xmlhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 401) {
          //Si tiene éxito y nos devuelve un 401, significa que el usuario ha salido de la aplicación y le expulsamos al login
          window.location.href = "https://foodiesaurus.miasalazar.com/view/login.html";
        }
      };
      xmlhttp.send();
    }

    //Obtenemos los datos del usuario
    const getProfile = () => {
      var xmlhttp = new XMLHttpRequest();
      xmlhttp.open("GET", "https://foodiesaurus.miasalazar.com/controller/profile.php", true);
      xmlhttp.setRequestHeader("Content-Type", "application/json");
      xmlhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
          //Si ha habido éxito, guardamos los datos del usuario en la variable user
          user = JSON.parse(this.responseText);
          putData();
        } else if (this.status == 401) {
          //Si la persona no está autorizada, la expulsamos
          window.location.href = "https://foodiesaurus.miasalazar.com/view/login.html";
        } else if (this.status == 400) {
          //Si hay un error, devolvemos un error
          subtitle.innerHTML = "Hubo un error al encontrar los datos del usuario";
        }  
      };
      xmlhttp.send();
    };

    //Cambiamos los valores de los inputs
    const putData = () => {
      name.innerHTML = user.name;
      email.innerHTML = user.email;
      img.src = user.picture;
    }

    //Comprobamos si el usuario está activo
    const checkIsLoggedIn = () => {
      var xmlhttp = new XMLHttpRequest();
      xmlhttp.open("GET", "https://foodiesaurus.miasalazar.com/controller/isLoggued.php", true);
      xmlhttp.setRequestHeader("Content-Type", "application/json");
      xmlhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
          //Si el usuario ha iniciado sesión, llamamos a la función que añade los datos a los inputs
          getProfile();
        } else if (this.status == 401) {
          //Si no ha iniciado sesión, le expulsamos al login
          window.location.href = "https://foodiesaurus.miasalazar.com/view/login.html";
        }  
      };
      xmlhttp.send();
    }

    checkIsLoggedIn();
  </script>
</html>
