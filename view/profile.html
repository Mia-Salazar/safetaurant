<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="keywords" content="alergenos, carta alérgenos, restaurantes, puntuación"/>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" type="text/css" href="../assets/stylesheets/index.css">
    <link rel="stylesheet" type="text/css" href="../assets/stylesheets/profile.css">
    <link rel="icon" href="../assets/img/favicon.ico" />
    <link rel="apple-touch-icon" href="../assets/img/logo.png" />
    <title>SafeTaurant, restaurantes sin alergias</title>
  </head>
  <header class="header">
    <div class="title-container">
      <h1 class="title">Safe<span>Taurant</span></h1>
      <figure class="shield-container">
        <img class="shield" src="../assets/img/shield.png" alt="" />
      </figure>
    </div>
    <nav class="nav">
      <button id="toggle" class="toggle" aria-label="Abrir menú">
        <i class="toggle-item" aria-hidden="true"></i>
        <i class="toggle-item" aria-hidden="true"></i>
        <i class="toggle-item" aria-hidden="true"></i>
      </button>

        <li>
          <a class="nav-link" href="http://localhost/TFG/view/profile.html">Buscar</a>

  </header>
    <main class="main profile">
      <h2>Perfil</h2>
      <p id="subtitle">En esta pagina podrás ver los datos de tu perfil y podrás editarlos.</p>
      <div class="profile-wrapper">
        <form class="profile-form" id="profile">
          <div class="input-group">
            <label class="input-label" for="Name">Nombre: </label>
            <input disabled class="input" id="Name" name="Name" type="text" required />
          </div>
          <div class="input-group">
            <label class="input-label" for="Surname">Apellido: </label>
            <input disabled class="input" id="Surname" name="Surname" type="text" />
          </div>
          <div class="input-group">
            <label class="input-label" for="BirthDate">Fecha de nacimiento: </label>
            <input disabled class="input" id="BirthDate" name="BirthDate" type="date" required />
          </div>
          <div class="input-group">
            <label class="input-label" for="Email">Correo electrónico: </label>
            <input disabled class="input" id="Email" name="Email" type="email" required />
          </div>
          <div class="input-group">
            <label class="input-label" for="Password">Contraseña: </label>
            <input disabled class="input" id="Password" name="Password" placeholder="********" type="password" required />
            <small>La contraseña debe tener al menos 8 caracteres y deben ser letras o números</small>
          </div>
          <div class="input-group">
            <label class="input-label" for="Allergies">Alergias: </label>
            <textarea disabled id="Allergies" name="Allergies" rows="4" cols="50"></textarea>
          </div>
          <div class="checkbox-group">
            <label class="input-label" for="CeliacDisease">¿Celíaquía?</label>
            <input disabled class="input" id="CeliacDisease" name="CeliacDisease" type="checkbox" />
          </div>
          <div class="checkbox-group">
            <label class="input-label" for="LactoseIntolerance">¿Intolerancia a la lactosa?</label>
            <input disabled class="input" id="LactoseIntolerance" name="LactoseIntolerance" type="checkbox" />
          </div>
          <small id="feedback" class=""></small>
          <div class="button-container">
            <button type="button" class="secondary-button" id="toggleEdit">Editar perfil</button>
            <button type="submit" class="primary-button hidden" id="edit">Editar perfil</button>
          </div>
        </form>
        <div class="decoration-wrapper">
          <figure class="img-container">
            <img class="img" alt="" src="../assets/img/shield-3.png" />
          </figure>
        </div>
      </div>
    </main>
    <footer class="footer">
      <p><span class="logo-text">SafeTaurant</span>, restaurantes sin alergias</p>
      <p>Proyecto realizado por <a href="miasalazar.com" target="_blank">María Salazar</a></p>
    </footer>
  </body>
  <script type="text/javascript" src="./shared.js"></script>
  <script>
    const toggleEditButton = document.getElementById("toggleEdit");
    const editButton = document.getElementById("edit");
    const subtitle = document.getElementById("subtitle");
    const password = document.getElementById("Password");
    const name = document.getElementById("Name")
    const email = document.getElementById("Email")
    const birthDate =document.getElementById("BirthDate")
    const surname = document.getElementById("Surname")
    const lactoseIntolerance = document.getElementById("LactoseIntolerance");
    const celiacDisease = document.getElementById("CeliacDisease");
    const allergies = document.getElementById("Allergies");
    const feedback = document.getElementById("feedback");
    const submit = document.getElementById("profile");

    let user;
    let toggleEdit = false;

    toggleEditButton.addEventListener("click", toggleEditFunction, false);
    profile.addEventListener("submit", editFunction, false);

    function editFunction(event){
      event.preventDefault();
      if(!hasCorrectPassword(password.value)) {
        alert("La contraseña debe tener 8 caracteres que sean números o letras");
        return;
      }
      editButton.innerHTML = "Cargando...";
      const data = {
        Name: name.value,
        Password: password.value,
        Surname: surname.value,
        LactoseIntolerance: lactoseIntolerance.checked ? 1 : 0,
        CeliacDisease: celiacDisease.checked ? 1 : 0,
        Allergies: allergies.value
      };
      var xmlhttp = new XMLHttpRequest();
      xmlhttp.open("POST", "http://localhost/TFG/controller/profile-edit.php", true);
      xmlhttp.setRequestHeader("Content-Type", "application/json");
      xmlhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
          if (this.responseText === "OK") {
            feedback.innerHTML = "Actualizado correctamente";
            feedback.classList.add("success");
            feedback.classList.remove("error");
            toggleEditFunction();
          } else {
            feedback.innerHTML = this.responseText;
            feedback.classList.add("error");
            feedback.classList.remove("success");
          }
        } else if (this.status == 401) {
          window.location.href = "http://localhost/TFG/view/login.html";
        }
        editButton.innerHTML = "Editar perfil";
      };
      xmlhttp.send(JSON.stringify(data));
    };

    function toggleDisable(value) {
      const elements = ["Password", "Name","Surname", "LactoseIntolerance", "CeliacDisease", "Allergies"];
      elements.forEach(element => {
        document.getElementById(element).disabled = value;
      });
    }

    function toggleEditFunction() {
      if(!toggleEdit) {
        toggleEditButton.innerHTML = "Dejar de editar";
        editButton.classList.remove("hidden");
      } else {
        toggleEditButton.innerHTML = "Editar perfil";
        editButton.classList.add("hidden");
      }
      toggleDisable(toggleEdit);
      toggleEdit = !toggleEdit;
    }

    function getProfile() {
      var xmlhttp = new XMLHttpRequest();
      xmlhttp.open("GET", "http://localhost/TFG/controller/profile.php", true);
      xmlhttp.setRequestHeader("Content-Type", "application/json");
      xmlhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
          if (this.responseText === "Error") {
            subtitle.innerHTML = "Hubo un error al encontrar los datos del usuario";
          } else {
            user = JSON.parse(this.responseText);
            putData();
          }
        } else if (this.status == 401) {
          window.location.href = "http://localhost/TFG/view/login.html";
        }  
      };
      xmlhttp.send();
    };

    function putData() {
      name.value = user.Name;
      email.value = user.Email;
      birthDate.value = user.BirthDate;
      surname.value = user.Surname;
      allergies.value = user.Allergies;
      user.LactoseIntolerance === "1" ? lactoseIntolerance.checked = true : lactoseIntolerance.checked = false;
      user.CeliacDisease === "1" ? celiacDisease.checked = true : celiacDisease.checked = false;
    }

    getProfile();
  </script>
</html>
