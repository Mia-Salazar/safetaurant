<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#319DA0" />
    <meta name="description" content="Una aplicación web donde puedes ver y puntuar restaurante según los alérgenos">
    <meta name="keywords" content="alergenos, carta alérgenos, restaurantes, puntuación"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../assets/stylesheets/index.css">
    <link rel="stylesheet" type="text/css" href="../assets/stylesheets/login-register.css">
    <link rel="icon" href="../assets/img/favicon.ico" />
    <link rel="apple-touch-icon" href="../assets/img/logo.png" />
    <title>Foodiesaurus, restaurantes sin alergias</title>
  </head>
  <body>
    <header class="header">
      <div class="title-container">
        <a href="https://foodiesaurus.miasalazar.com/index.html" class="home-link" aria-label="Ir a la home">
          <h1 class="title">
            <span>Foodie</span>
            <figure class="logo-container">
              <img class="logo" src="../assets/img/foodiesaurus.png" alt="" />
            </figure>
            <span>saurus</span>
          </h1>
        </a>
      </div>
    </header>
    <main class="main form">
      <form class="login-form" id="register">
        <h2>¡Te damos la bienvenida de nuevo!</h2>
        <div class="input-group">
          <label class="input-label" for="email">Correo electrónico*: </label>
          <input pattern="^(?!.*<[^>]+>).*"  class="input" id="email" placeholder="Escribe tu email" name="email" type="email" required />
        </div>
        <div class="input-group">
          <label class="input-label" for="password">Contraseña*: </label>
          <input pattern="^(?!.*<[^>]+>).*"  class="input" id="password" placeholder="Escribe tu contraseña" name="password" type="password" required />
        </div>
        <small id="error" class="error"></small>
        <button type="submit" class="primary-button" id="buttonSubmit">Iniciar sesión</button>
        <a class="link" href="https://foodiesaurus.miasalazar.com/view/register-user.html">Regístrate</a>
      </form>
    </main>
    <footer class="footer">
      <p><span class="logo-text">Foodiesaurus</span>, restaurantes sin alergias</p>
      <p>Proyecto realizado por <a href="https://miasalazar.netlify.app/" target="_blank">María Salazar</a></p>
    </footer>
  </body>
  <script type="text/javascript" src="./shared.js"></script>
  <script>
    document.getElementById("register").addEventListener("submit", login, false);

    function login(event){
      event.preventDefault();
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const buttonSubmit = document.getElementById("buttonSubmit");
      const error = document.getElementById("error");
      //Mostramos al usuario que la aplicación está en proceso
      buttonSubmit.innerHTML = "Cargando...";
      error.innerHTML = "";
      //Creamos un objeto con los datos para iniciar sesión
      const data = {
        email: email.value,
        password: password.value,
      };
      //Comprobamos si la contraseña es correcta, sino se lanzará una alerta
      if(!hasCorrectPassword(password.value)) {
        buttonSubmit.innerHTML = "Registrar";
        alert("La contraseña debe tener 8 caracteres que sean números o letras");
        return;
      }
      //Hacemos la petición al back-end
      var xmlhttp = new XMLHttpRequest();
      xmlhttp.open("POST", "https://foodiesaurus.miasalazar.com/controller/login.php", true);
      xmlhttp.setRequestHeader("Content-Type", "application/json");
      xmlhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
          //Si el inicio de sesión es correcto, le enviamos a la página principal
          window.location.href = "https://foodiesaurus.miasalazar.com/index.html";
        } else if (this.status == 401) {
          //Si el inicio de sesión no es correcto, le mostramos que la carga ha terminado y un mensaje de error
          buttonSubmit.innerHTML = "Iniciar sesión";
          error.innerHTML = "El email o la contraseña son incorrectos";
        } 
      };
      xmlhttp.send(JSON.stringify(data));
    }
  </script>
</html>
