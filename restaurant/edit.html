    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../assets/stylesheets/index.css">
    <link rel="stylesheet" type="text/css" href="../assets/stylesheets/input-range.css">
    <link rel="stylesheet" type="text/css" href="../assets/stylesheets/profile.css">
    <link rel="stylesheet" type="text/css" href="../assets/stylesheets/add-restaurant.css">
    <link rel="stylesheet" type="text/css" href="../assets/stylesheets/checkboxes.css">
    <script src="https://kit.fontawesome.com/e8797cc6b0.js" crossorigin="anonymous"></script>
    <link rel="icon" href="../assets/img/favicon.ico" />
    <link rel="apple-touch-icon" href="../assets/img/logo.png" />
    <title>Foodiesaurus, restaurantes sin alergias</title>
  </head>
  <body>
    <a class="skip-to-content-link" href="#main">
      Saltar al contenido
    </a>
    <header class="header">
      <div class="title-container">
        <a href="https://foodiesaurus.com/" class="home-link" aria-label="Ir a la home">
          <h1 class="title">
            <span>Foodie</span>
            <figure class="logo-container">
              <img class="logo" width="42px" height="42px" src="../assets/img/foodiesaurus.png" alt="" />
            </figure>
            <span>saurus</span>
          </h1>
        </a>
      </div>
      <nav class="nav">
        <button id="toggle" class="toggle" aria-label="Abrir menú">
          <i class="toggle-item" aria-hidden="true"></i>
          <i class="toggle-item" aria-hidden="true"></i>
          <i class="toggle-item" aria-hidden="true"></i>
        </button>
        <ul class="nav-list" id="nav">
          <li>
            <a class="nav-link" href="https://foodiesaurus.com/">Buscar</a>
          </li>
          <li>
            <a class="nav-link" href="https://foodiesaurus.com/restaurant/search.html">Crear restaurante</a>
          </li>
          <li class="nav-link">
            <button id="account-dropdown-button" class="account-dropdown-button nav-link"
              data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Mi cuenta <i class="arrow down" aria-hidden="true"></i></button>
            <ul id="account-dropdown-list" aria-labelledby="account-dropdown-button" class="dropdown" aria-label="Alternar menú de cuenta">
              <li>
                <a class="nav-link" href="https://foodiesaurus.com/profile/index.html">Perfil</a>
              </li>
              <li>
                <a class="nav-link" href="https://foodiesaurus.com/profile/restaurants.html">Mis restaurantes</a>
              </li>
              <li>
                <a class="nav-link" href="https://foodiesaurus.com/profile/scores.html">Mis opiniones</a>
              </li>
            </ul>
          </li>
        </ul>

      </nav>
    </header>
    <main class="main add-restaurant container" id="main">
      <h2>Editar restaurante</h2>
      <div class="add-restaurant-wrapper">
        <form class="add-restaurant-form" id="add">
          <div class="input-group">
            <label class="input-label" for="name">Nombre del restaurante*: </label>
            <input pattern="^(?!.*<[^>]+>).*"  class="input" id="name" name="name" type="text" required />
          </div>
          <div class="input-group">
            <label class="input-label" for="province">Provincia*: </label>
            <select name="province" id="province" class="select" required>
              <option selected disabled value="">Escoge Provincia</option>
            </select>
          </div>
          <div class="input-group">
            <label class="input-label" for="address">Dirección*: </label>
            <input pattern="^(?!.*<[^>]+>).*"  class="input" id="address" name="address" type="text" required />
          </div>
          <div class="input-group">
            <label class="input-label" for="ZIP">Código Postal*: </label>
            <input class="input" id="ZIP" name="ZIP" min="10000" max="99999" type="number" required />
          </div>
          <div class="input-group">
            <label class="input-label" for="phone">Teléfono: </label>
            <input class="input" id="phone" name="phone" type="number" />
          </div>
          <div class="input-group">
            <label class="input-label" for="url">Sitio web: </label>
            <input pattern="^(?!.*<[^>]+>).*" class="input" id="url" name="url" type="url" />
          </div>
          <div class="input-group">
            <label class="input-label" for="foodType">Tipo de comida: </label>
            <select name="foodType" id="foodType" class="select">
              <option selected disabled value="">Escoge el tipo</option>
            </select>
          </div>
          <small id="feedback" class=""></small>
          <button type="submit" class="primary-button" id="buttonSubmit">
            <div class="loader-container">
              <span id="buttonText">Editar restaurante</span>
              <span class="loader loader--light" role="alert" aria-busy="true" id="loader"></span>
            </div>
          </button>
        </form>
        <figure class="img-container">
          <img class="img" alt="logo"  width="42px" height="42px" src="../assets/img/food.jpg" />
        </figure>
      </div>
    </main>
    <footer class="footer">
      <div>
        <div class="footer__logo">
          <p>Foodie</p>
          <figure class="footer-img">
            <img class="img" alt="logo"  width="42px" height="42px" src="../assets/img/foodiesaurus-transparent.png"  />
           </figure>
          <p>saurus</p>
        </div>
        <p class="copyright">Foodiesaurus©, restaurantes sin alergias</p>
      </div>
      <div class="footer__container">
        <p class="footer__by">Por <a href="https://miasalazar.netlify.app/" class="footer__name" target="_blank">Mia Salazar</a></p>

          <li><a href="https://www.linkedin.com/in/miasalazar/" aria-label="Ir a mi Linked"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a></li>
          <li><a href="https://dev.to/miasalazar" aria-label="Ir a mi Dev.to"><i class="fa-brands fa-dev" aria-hidden="true"></i></a></li>
          <li><a href="https://marasalazar.medium.com/" aria-label="Ir a mi Medium"><i class="fa-brands fa-medium" aria-hidden="true"></i></a></li>
          <li><a href="https://github.com/Mia-Salazar" aria-label="Ir a mi GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a></li>
        </ul>
      </div>
    </footer>
  </body>

</html>
